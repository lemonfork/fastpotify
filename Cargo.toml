[package]
name = "fastpotify"
version = "0.5.0-rc1"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "A small native Navidrome and OpenSubsonic music client"
repository = "https://github.com/crmne/fastpotify"
keywords = ["navidrome", "opensubsonic", "music", "egui", "player"]
categories = ["multimedia::audio"]

[lib]
name = "fastpotify"
path = "src/lib.rs"

[[bin]]
name = "fastpotify"
path = "src/main.rs"

[dependencies]
anyhow = "1"
thiserror = "2"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
directories = "6"
# The whole UI. glow keeps the binary and the dependency tree small; wgpu is
# not needed for a 2D music client.
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "links", "wayland", "x11", "persistence"] }
egui = "0.36"
egui_extras = { version = "0.36", features = ["image", "svg"] }
# Reading what a system font covers, so the app can borrow a face for a script
# Inter cannot draw. skrifa is the parser epaint already rasterizes with, and
# the version has to track epaint's or the binary compiles two copies of it;
# memmap2 keeps the probe to the few pages of each font that answer the
# question.
skrifa = "0.44"
memmap2 = "0.9"
# bmp is for Winamp skins, whose bitmaps are BMP files.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp"] }
# Inflating the zip a Winamp skin comes as (src/skin/zip.rs). Already
# compiled for reqwest's gzip support, so this adds no code to the build.
flate2 = "1"
# Filling glyph outlines with no anti-aliasing for the Winamp playlist's
# text (src/ui/winamp/pixel_text.rs). Already compiled for the SVG icons
# through egui_extras and resvg, so this adds no code to the build.
tiny-skia = "0.11"
# Local audio output. The project owns device selection and error handling so
# a missing output device remains a visible playback error rather than a panic.
rodio = { version = "0.21", default-features = false, features = ["playback"] }
cpal = "0.16"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json", "gzip", "http2", "stream"] }
# The runtime hosts API work and stream downloads; the UI thread never blocks.
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
# SHA-1 scopes disposable cache entries and produces a non-secret profile
# fingerprint. OpenSubsonic's required salted request token uses MD5.
sha1 = "0.10"
md5 = "0.7"
# Opaque media/artwork references encode arbitrary server string IDs.
base64 = "0.22"
rand = "0.9"
# Symphonia decodes common server originals and the requested MP3 transcode.
symphonia = { version = "0.5", default-features = false, features = ["mp3", "aac", "alac", "isomp4", "flac", "ogg", "vorbis"] }
# Symphonia can demux Ogg Opus but has no Opus decoder. Keep the fallback in
# pure Rust so every desktop target uses the same codec implementation.
opus-pure = "0.2.1"
open = "5"
jiff = "0.2"
unicode-bidi = "0.3"

[target.'cfg(not(target_os = "linux"))'.dependencies]
# The tray item on Windows and macOS. Linux has ksni below.
tray-icon = { version = "0.24", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
# Serving AppKit while no window exists: the status item and Dock reopen
# callback live on the main thread.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSEvent", "NSMenu", "NSMenuItem", "NSResponder", "NSRunningApplication"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSDate", "NSDictionary", "NSObjCRuntime", "NSObject", "NSRunLoop", "NSString", "NSValue"] }
# Generated bindings let macOS use MediaPlayer.framework directly without
# souvlaki's obsolete Cocoa/block dependency or a Swift runtime dependency.
objc2-media-player = { version = "0.3", default-features = false, features = ["MPMediaItem", "MPNowPlayingInfoCenter", "MPRemoteCommand", "MPRemoteCommandCenter", "MPRemoteCommandEvent"] }

[target.'cfg(windows)'.dependencies]
# A hidden window for the media controls to belong to, and message loops.
souvlaki = { version = "0.8", default-features = false }
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", features = ["blocking"] }
mpris-server = { version = "0.10", features = ["tokio"] }

# The icon and version information Windows shows for the executable.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[features]
default = []
# Sample data and screenshot flags; never part of a release build.
demo = []

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# Audio decoding and immediate-mode layout are too slow at opt-level 0 to
# audition the app in development. Keep every dependency optimized while the
# application crate itself stays incremental.
[profile.dev.package."*"]
opt-level = 2
